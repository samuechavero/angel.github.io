kind = "web"
previewPath = "/"
title = "Caridad Agency VSL"
version = "1.0.0"
id = "artifacts/caridad-vsl"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20129

[services.development]
run = "pnpm --filter @workspace/caridad-vsl run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/caridad-vsl", "run", "build" ]
serve = "static"
publicDir = "artifacts/caridad-vsl/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20129"
BASE_PATH = "/"
